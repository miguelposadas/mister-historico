# Historical content validation (`mister content validate --release`).
name: content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "backend/src/mister/catalog/**"
      - "backend/src/mister/bootstrap.py"
      - "backend/src/mister/entrypoints/cli/**"
      - "backend/uv.lock"
      - "Makefile"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "content/**"
      - "backend/src/mister/catalog/**"
      - "backend/src/mister/bootstrap.py"
      - "backend/src/mister/entrypoints/cli/**"
      - "backend/uv.lock"
      - "Makefile"
      - ".github/workflows/content.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Match the Python and uv versions used by backend.yml and the API Dockerfile.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.15"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Validate release content
        working-directory: backend
        run: uv run mister content validate --release --root ../content
